name: Update snowfall data

# GitHub's runners can reach data.jma.go.jp, so the scrape happens here rather
# than on your machine. 20:00 UTC Monday -- 05:00 JST Tuesday -- through the
# season, plus a manual trigger from the Actions tab.
on:
  schedule:
    - cron: "0 20 * 10,11,12,1,2,3,4,5,6 1"   # season runs Oct-May
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Rebuild the station index from scratch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snowfall-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The station index rarely changes, so it is committed and reused.
      # Discovery is one request per prefecture, ~50 in all. Rate limited in
      # the script, because JMA explicitly asks people not to hammer the site.
      - name: Build station index
        if: ${{ inputs.rediscover || hashFiles('station_index.json') == '' }}
        run: python3 jma_snowfall.py discover

      - name: Fetch snowfall records
        run: python3 jma_snowfall.py fetch

      # Kutchan's series was confirmed against independently published
      # figures, so it catches a JMA markup change that still parses but
      # returns the wrong column. Fail before anything is committed.
      - name: Check Kutchan against the transcribed table
        run: python3 jma_snowfall.py verify

      # Cached station-months are skipped, so a normal run only picks up the
      # season in progress: 37 stations x 8 months, ~300 requests, against
      # ~14,000 for a cold start.
      - name: Fetch daily records
        run: python3 jma_snowfall.py daily

      # The map's whole-network survey: one request per snow-recording station,
      # ~350. Independent of the resort list, and the page reads "the current
      # season" off this file, so skipping it would freeze the map a year back.
      - name: Survey every snow station
        run: python3 jma_snowfall.py survey

      - name: Rebuild site
        run: python3 site.py build

      - name: Show what changed
        run: git diff --stat

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html plan.html trends.html map.html station_index.json
          if git diff --staged --quiet; then
            echo "No change in the JMA figures."
          else
            git commit -m "Update snowfall data ($(date -u +%Y-%m-%d))"
            git push
          fi
